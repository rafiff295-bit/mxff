name: Build IPA — FOUGO EXTERNAL

on:
  push:
    branches: [main]
  workflow_dispatch:   # Triggered by the Telegram bot via GitHub API

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup project
        run: python3 "setup_and_build.py"

      - name: Verify xcodeproj
        run: |
          echo "Working dir: $(pwd)"
          ls -la
          ls -la FOUGOEXTERNAL.xcodeproj/ || echo "xcodeproj NOT FOUND"
          head -30 FOUGOEXTERNAL.xcodeproj/project.pbxproj
          echo "--- Source files written ---"
          find Sources -name "*.swift" -o -name "*.m" -o -name "*.c" | sort | head -50

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project FOUGOEXTERNAL.xcodeproj \
            -scheme FOUGOEXTERNAL \
            -configuration TgtRelease \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            SKIP_INSTALL=NO \
            DEPLOYMENT_POSTPROCESSING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build 2>&1 | tee /tmp/xcode_full.log
          echo "EXIT: $?"

      - name: Show errors and status
        if: always()
        run: |
          echo "=== BUILD RESULT ==="
          grep -E "BUILD SUCCEEDED|BUILD FAILED" /tmp/xcode_full.log | tail -3
          echo "=== COMPILER ERRORS ==="
          grep -E "error:" /tmp/xcode_full.log | grep -v "^note:" | head -60
          echo "=== LINKER ERRORS ==="
          grep -iE "ld: error|linker command failed|undefined symbol" /tmp/xcode_full.log | head -20

      - name: Inspect app
        if: always()
        run: |
          APP=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "App: $APP"
            ls -lah "$APP/"
            file "$APP/FOUGOEXTERNAL" 2>/dev/null || echo "No binary found"
          else
            echo "No .app produced"
          fi

      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" | head -1)
          test -n "$APP"
          test -f "$APP/FOUGOEXTERNAL" || { echo "Binary missing!"; exit 1; }
          mkdir -p Payload
          cp -r "$APP" Payload/FOUGOEXTERNAL.app
          zip -qr FOUGO_EXTERNAL.ipa Payload/
          ls -lh FOUGO_EXTERNAL.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FOUGO-EXTERNAL-ipa       # Must match _GH_ARTIFACT in mxff_bot.py
          path: FOUGO_EXTERNAL.ipa
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: /tmp/xcode_full.log
          retention-days: 7

      # ── Optional: notify the Telegram bot owner on completion ──────────────
      # Requires BOT_TOKEN and OWNER_ID to be added as GitHub Secrets.
      # The bot also polls for completion automatically, so this step is a
      # belt-and-suspenders push notification. It is intentionally a soft
      # failure (continue-on-error: true) so a missing secret never breaks
      # the whole workflow.
      - name: Notify Telegram — Success
        if: success() && env.BOT_TOKEN != '' && env.OWNER_ID != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID:  ${{ secrets.OWNER_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="✅ <b>Build Succeeded</b>%0A%0ARun: <code>${{ github.run_id }}</code>%0A<a href='${RUN_URL}'>View on GitHub</a>%0A%0AOpen the bot → 🔨 Build IPA → 📥 Download IPA"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${OWNER_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" > /dev/null

      - name: Notify Telegram — Failure
        if: failure() && env.BOT_TOKEN != '' && env.OWNER_ID != ''
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID:  ${{ secrets.OWNER_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="❌ <b>Build Failed</b>%0A%0ARun: <code>${{ github.run_id }}</code>%0A<a href='${RUN_URL}'>View logs on GitHub</a>"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${OWNER_ID}" \
            -d "text=${MSG}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" > /dev/null
