name: Build IPA — AIRCORE EXTERNAL

on:
  push:
    branches: [main]
  schedule:
    # watchdog: প্রতি ৪ ঘণ্টায় বট job চালু হয়, যাতে বট ২৪/৭ অনলাইন থাকে
    # (build job নিজে schedule-এ স্কিপ করা হয়, শুধু push/manual-এ বিল্ড হয়)
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      aircore_runner:
        description: 'Runner for the Telegram bot (self-hosted recommended — API needs a public IP)'
        required: false
        default: 'self-hosted'

jobs:
  build:
    name: Build unsigned IPA
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: aircore-build-ipa
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode found"; exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup project
        run: python3 "setup_and_build.py"

      - name: Verify xcodeproj
        run: |
          echo "Working dir: $(pwd)"
          ls -la
          ls -la AIRCOREEXTERNAL.xcodeproj/ || echo "xcodeproj NOT FOUND"
          head -30 AIRCOREEXTERNAL.xcodeproj/project.pbxproj
          echo "--- Source files written ---"
          find Sources -name "*.swift" -o -name "*.m" -o -name "*.c" | sort | head -50

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project AIRCOREEXTERNAL.xcodeproj \
            -scheme AIRCOREEXTERNAL \
            -configuration TgtRelease \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            SKIP_INSTALL=NO \
            DEPLOYMENT_POSTPROCESSING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build 2>&1 | tee /tmp/xcode_full.log
          echo "EXIT: $?"

      - name: Show errors and status
        if: always()
        run: |
          echo "=== BUILD RESULT ==="
          grep -E "BUILD SUCCEEDED|BUILD FAILED" /tmp/xcode_full.log | tail -3
          echo "=== COMPILER ERRORS ==="
          grep -E "error:" /tmp/xcode_full.log | grep -v "^note:" | head -60
          echo "=== LINKER ERRORS ==="
          grep -iE "ld: error|linker command failed|undefined symbol" /tmp/xcode_full.log | head -20

      - name: Inspect app
        if: always()
        run: |
          APP=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "App: $APP"
            ls -lah "$APP/"
            file "$APP/AIRCOREEXTERNAL" 2>/dev/null || echo "No binary found"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist" || true
          else
            echo "No .app produced"
          fi

      - name: Package IPA
        run: |
          APP=$(find DerivedData/Build/Products -maxdepth 3 -name "*.app" | head -1)
          test -n "$APP"
          test -f "$APP/AIRCOREEXTERNAL" || { echo "Binary missing!"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP" "Payload/$(basename "$APP")"
          rm -rf "Payload/$(basename "$APP")/_CodeSignature" || true
          zip -qr AIRCORE_EXTERNAL.ipa Payload/
          ls -lh AIRCORE_EXTERNAL.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIRCORE-EXTERNAL-ipa
          path: AIRCORE_EXTERNAL.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aircore-build-log
          path: /tmp/xcode_full.log
          retention-days: 7
          if-no-files-found: ignore

  bot:
    name: Telegram Bot + API
    runs-on: ${{ github.event.inputs.aircore_runner || vars.RUNNER_LABEL || 'self-hosted' }}
    timeout-minutes: 330
    concurrency:
      group: aircore-bot-runtime
      cancel-in-progress: true
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN || vars.BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID || vars.OWNER_ID }}
      API_PORT: '10020'
      PATCH_PORT: '10022'
      DATA_DIR: data
      PYTHONUNBUFFERED: '1'
      SAVE_INTERVAL: '300'
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_FILE: fougo_data.json
    steps:
      - uses: actions/checkout@v4
        with:
          # data/ মুছে ফেলবেন না — আপলোড করা .onyx প্যাচ ফাইলগুলো ওখানেই থাকে
          clean: false

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check
        run: |
          python -c "import ast; ast.parse(open('mxff_bot.py').read()); print('mxff_bot.py syntax OK')"
          python persist_data.py show

      - name: Run bot (supervised)
        run: bash ./run_bot.sh

      - name: State snapshot
        if: always()
        run: python persist_data.py show
